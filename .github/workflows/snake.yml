# Redraws the contribution "snake" every day and stores it on the `output` branch.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 00:00 UTC (05:30 IST)
  workflow_dispatch:       # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#000000&color_dots=#ebebeb,#c2c2c2,#8f8f8f,#525252,#1a1a1a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#161616,#3d3d3d,#707070,#a8a8a8,#ffffff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
